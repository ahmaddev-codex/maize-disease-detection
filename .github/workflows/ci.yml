name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# One run per branch; a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # The models are not in the repository (they are large binaries), and the
      # test suite uses fakes rather than the real interpreter, so no model
      # download step is needed here.
      - run: flutter test

  python:
    name: Python — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (CPU TensorFlow)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract (OCR tests)
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" || true
          sudo apt-get install -y --no-install-recommends tesseract-ocr || true

      # Tests that need the exported .tflite files skip themselves when the
      # models are absent; everything else must pass.
      - run: pytest tests/ -q

  claims:
    name: Claims, secrets and single sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_claims.sh
