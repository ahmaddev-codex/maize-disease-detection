name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch; a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --enforce-lockfile: CI resolves exactly what the lockfile pins, so a
      # transitive bump cannot land silently through a green run.
      - run: flutter pub get --enforce-lockfile

      - run: flutter analyze

      # The models are not in the repository (they are large binaries), and the
      # test suite uses fakes rather than the real interpreter, so no model
      # download step is needed here.
      - run: flutter test

  python:
    name: Python — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (CPU TensorFlow)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      # Tests that need the exported .tflite files skip themselves when the
      # models are absent; everything else must pass.
      - run: pytest tests/ -q

  claims:
    name: Claims, secrets and single sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_claims.sh
